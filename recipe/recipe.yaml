context:
  version: "1.4.1"

package:
  name: doggo
  version: ${{ version }}

source:
  url: https://github.com/mr-karan/doggo/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d707bd7948cd560c290298ba623f70681e93862eed2c8555b09b7b90f5610c9c
  target_directory: src

build:
  number: 0
  script:
    - cd src
    - go-licenses save ./cmd/doggo --save_path ../library_licenses
    # Go 1.27's PIE binaries crash at startup on linux-ppc64le (SIGSEGV in the
    # runtime during package init), so build a regular executable there.
    - if: unix
      then: go build -v -o $PREFIX/bin/doggo -ldflags="-s -w" ${{ "-buildmode=exe" if ppc64le else "" }} ./cmd/doggo
      else: go build -v -o %LIBRARY_BIN%\doggo.exe -ldflags="-s" .\cmd\doggo

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script: doggo --help
  - package_contents:
      bin:
        - doggo
      strict: true

about:
  homepage: https://github.com/mr-karan/doggo
  summary: 🐶 Command-line DNS Client for Humans.
  description: |
    doggo is a modern command-line DNS client (like dig) written in Golang. It outputs information in a neat concise manner and supports protocols like DoH, DoT, DoQ, and DNSCrypt as well.
  license: GPL-3.0-or-later
  license_file:
    - src/LICENSE
    - library_licenses/
  documentation: https://pkg.go.dev/github.com/mr-karan/doggo
  repository: https://github.com/mr-karan/doggo

extra:
  recipe-maintainers:
    - pavelzw
